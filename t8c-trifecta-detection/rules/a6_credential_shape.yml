title: De-prefixed credential shape in an agent tool argument
name: a6_credential_shape
description: Leg 3 (way out) for the CS0067 shape, AML.T0085.002 + AML.T0086. Matches the fixture's de-prefixed key marker in tool arguments; content match.
status: experimental
logsource: {category: api}
detection:
